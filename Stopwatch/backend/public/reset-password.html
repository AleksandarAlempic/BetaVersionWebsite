<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4c066">
  <title>KV Workout — Nova lozinka</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      box-sizing: border-box;
      background: #f4c066;
      color: #191713;
      font-family: Arial, sans-serif;
    }
    main {
      width: 100%;
      max-width: 400px;
      padding: 28px;
      box-sizing: border-box;
      background: #fffaf0;
      border: 3px solid #191713;
      box-shadow: 8px 8px 0 #191713;
    }
    h1 {
      font-family: Impact, "Arial Narrow Bold", sans-serif;
      text-transform: uppercase;
    }
    label {
      display: block;
      margin: 18px 0 7px;
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
    }
    input {
      width: 100%;
      min-height: 46px;
      padding: 10px;
      box-sizing: border-box;
      border: 2px solid #191713;
      font-size: 16px;
    }
    button {
      width: 100%;
      min-height: 50px;
      margin-top: 22px;
      border: 2px solid #191713;
      background: #191713;
      color: #fffaf0;
      font-weight: bold;
      cursor: pointer;
    }
    #status {
      margin-top: 16px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }
    a { color: #191713; }
  </style>
</head>
<body>
  <main>
    <h1>Nova lozinka</h1>
    <p>Unesi novu lozinku za svoj KV Fit nalog.</p>

    <form id="reset-form">
      <label for="password">Nova lozinka</label>
      <input id="password" type="password" minlength="6"
             autocomplete="new-password" required>

      <label for="confirm-password">Potvrdi novu lozinku</label>
      <input id="confirm-password" type="password" minlength="6"
             autocomplete="new-password" required>

      <button type="submit">Sačuvaj novu lozinku</button>
    </form>

    <p id="status" role="status" aria-live="polite"></p>
    <p><a href="/login.html">Nazad na prijavu</a></p>
  </main>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    const supabase = createClient(
      'https://mcuhtmzkszuhhyhydivj.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1jdWh0bXprc3p1aGh5aHlkaXZqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDM5NTIzMDIsImV4cCI6MjA1OTUyODMwMn0.UYL-lVnxir4WBpbU-MWRwP1jAl7S21S-z_mVwUgt8xE'
    );

    const status = document.getElementById('status');

    const { data: { session } } = await supabase.auth.getSession();

    if (!session) {
      status.textContent =
        'Nema aktivne sesije za resetovanje. Zatraži novi link preko stranice za prijavu.';
    }

    document.getElementById('reset-form').addEventListener('submit', async (event) => {
      event.preventDefault();

      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm-password').value;

      if (password !== confirmPassword) {
        status.textContent = 'Lozinke se ne poklapaju.';
        return;
      }

      status.textContent = 'Čuvanje nove lozinke...';

      const { error } = await supabase.auth.updateUser({ password });

      if (error) {
        status.textContent = 'Greška: ' + error.message;
        return;
      }

      status.textContent = 'Lozinka je uspešno promenjena. Možeš da se prijaviš novom lozinkom.';
    });
  </script>
</body>
</html>
